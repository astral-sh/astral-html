name: Benchmark harness

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'crates/astral-html/src/**'
      - 'crates/astral-html/Cargo.toml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/benchmarks.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml --all --check
      - run: cargo test --manifest-path benchmarks/Cargo.toml --locked
      - run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s benchmarks/scripts -p 'test_*.py'
      - run: python3 benchmarks/scripts/run.py --output benchmarks/runs/ci --smoke --runs 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-smoke
          path: benchmarks/runs/ci
          if-no-files-found: warn
          retention-days: 30
