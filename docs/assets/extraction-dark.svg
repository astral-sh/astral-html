<svg xmlns="http://www.w3.org/2000/svg" version="1.1" class="marks" width="585" height="167" viewBox="0 0 585 167">
  <title>Link extraction from the PEP index</title>
  <desc>2,099 links from 418,744 bytes of warm HTML input. Median of 3 session means; lower is better. astral-html uses Reader. Source 58a28da8420cc71f1f829372769ae4d1d036e85e. Shared KVM VM on AMD EPYC. Affinity pins a guest vCPU; physical-core exclusivity, host scheduling, frequency/power policy, and neighbor load are not controlled.</desc>
